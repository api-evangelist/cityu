  - date: '2026-08-30'
    rating: 2
    summary: >-
      Re-profiled under the API Evangelist university pipeline, which settles
      WHO OPERATES a surface before saving any contract. The 34 OpenAPI
      definitions this repository held were not CityUHK's. Every one carried
      info.title "Pure <resource> API", info.contact pure-support@elsevier.com
      and servers ["/ws/api"] — Elsevier's generic Pure API 5.35.1-2 product
      contract, shipped identically by at least nine other institutions in the
      cohort, split into 34 per-tag documents by our own refine step and then
      into 34 apis[] entries. DNS settles it independently: scholars.cityu.edu.hk
      is a CNAME to cityu.elsevierpure.com. Those 34 specs plus the 84
      collections, schemas, structures, examples, rules, vocabularies, JSON-LD
      contexts, capability edges and agentic-access files derived from them —
      118 files — were removed, and the Pure deployment is now recorded once as
      a tenant relationship. What survived scrutiny, and what was newly found:
      the OAI-PMH endpoint is real and open (Identify, ListMetadataFormats and
      ListSets all 200, with persons, publications, student theses, datasets and
      an OpenAIRE set, and ORCID iDs inline in the harvested Dublin Core); and
      CityUHK operates its OWN Shibboleth Identity Provider at
      idp2.cityu.edu.hk, publishing live SAML 2.0 IdP metadata and registered in
      eduGAIN through the Hong Kong Access Federation. Single sign-on is an Okta
      tenant on auth.cityu.edu.hk serving public OIDC Discovery and RFC 8414
      metadata; Canvas is an Instructure tenant. CityUHK's IT Services runs a
      genuine internal API gateway and API management practice on MuleSoft
      Anypoint, but none of it is public and there is no developer portal. The
      whole www.cityu.edu.hk estate sits behind an Imperva bot challenge that
      returns 200 with a challenge body on every deep path. Corrected footprint:
      one institution-operated machine-readable contract, four tenant surfaces,
      zero fabricated endpoints. The score should fall, and that is the point.
