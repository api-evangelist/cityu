description: >-
  City University of Hong Kong (CityUHK) is a publicly funded (UGC) research
  university in Kowloon, Hong Kong SAR. IT Services runs a real API programme —
  a gateway and API management practice on MuleSoft Anypoint connecting campus
  systems — but none of it is published or callable outside the university, and
  there is no public developer portal. The publicly reachable machine-readable
  footprint is small and, with one exception, TENANTED rather than built:
  CityUHK Scholars is an Elsevier Pure deployment (scholars.cityu.edu.hk CNAMEs
  to cityu.elsevierpure.com) with an open OAI-PMH endpoint and a gated REST
  service on Elsevier's contract; Canvas is an Instructure tenant; single
  sign-on is an Okta tenant at auth.cityu.edu.hk. The exception is the one
  contract CityUHK operates itself: its Shibboleth Identity Provider at
  idp2.cityu.edu.hk, registered in eduGAIN via the Hong Kong Access Federation.
  The official GitHub organisation publishes zero public repositories.
