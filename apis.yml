x-coverage:
  state: covered
  reason: tenant_only
  detail: >-
    CityUHK's publicly reachable machine-readable footprint is almost entirely
    tenanted, not built. The research information system is an Elsevier Pure
    deployment, the LMS is an Instructure tenant, and single sign-on is an Okta
    tenant on a CityUHK hostname; the only contract CityUHK operates itself is
    the Shibboleth IdP metadata at idp2.cityu.edu.hk, registered in eduGAIN via
    HKAF. CityUHK does run a genuine internal API programme on MuleSoft Anypoint
    per its own IT Services service catalogue, but nothing in it is published or
    callable off-campus and there is no developer portal. Probing the main web
    estate is additionally limited: every deep path under www.cityu.edu.hk
    returns HTTP 200 carrying an Imperva/Incapsula bot-challenge body rather
    than page content, so the AI-policy and IT-Services pointers below are
    recorded from search-engine-indexed titles plus a live-but-challenged
    response, not from a body we could read. No open-data portal, course or
    timetable API, status page, or institution-operated REST API was found;
    data.cityu.edu.hk and opendata.cityu.edu.hk do not resolve, and
    api.cityu.edu.hk resolves inside CityUHK's own 144.214.0.0/16 range but does
    not answer from the public internet.
  generated: '2026-08-30'
