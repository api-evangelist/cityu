- aid: cityu:scholars-oai
  name: CityUHK Scholars OAI-PMH
  description: >-
    Public OAI-PMH (Open Archives Initiative Protocol for Metadata Harvesting, version 2.0) endpoint for
    CityUHK Scholars, the university's Elsevier Pure-powered research information system and institutional
    repository. The Identify verb returns repository name "CityUHK Scholars", with metadata records available
    from December 2016 onward. Supports standard OAI-PMH verbs (Identify, ListMetadataFormats, ListSets,
    ListIdentifiers, ListRecords, GetRecord). No authentication required.
  humanURL: https://scholars.cityu.edu.hk/
  baseURL: https://scholars.cityu.edu.hk/ws/oai
