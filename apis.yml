  generated: '2026-07-22'
  method: derived
position: Consumer
access: 3rd-Party
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/cityu.png
url: https://raw.githubusercontent.com/api-evangelist/cityu/refs/heads/main/apis.yml
tags:
